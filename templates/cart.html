<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere - Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #222;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 86%;
            margin: 40px auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .product-info p {
            margin: 5px 0;
            color: #666;
        }

        .subtotal {
            font-weight: bold;
            color: #2563eb;
        }

        .remove-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b91c1c;
        }

        .cart-summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: right;
        }

        .cart-summary h2 {
            margin-bottom: 15px;
        }

        .checkout-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout-btn:hover {
            background: #1d4ed8;
        }

        .empty-cart {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 50px;
        }

        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin-left: 10px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->

    <nav>

        <div class="logo">
            ShopSphere
        </div>

        <div>
            <a href="/home">Home</a>
            <a href="/cart">Cart</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>

    </nav>


    <!-- Cart -->

    <div class="container">

        <h1>🛒 My Cart</h1>

        <div id="cartContainer">

            <p>Loading cart...</p>

        </div>

    </div>


    <footer>

        <p>
            © 2026 ShopSphere. All Rights Reserved.
        </p>

    </footer>


    <script>

        async function loadCart() {

            const container =
                document.getElementById("cartContainer");

            try {

                const response =
                    await fetch("/api/cart/");

                const data =
                    await response.json();


                if (data.status !== "success") {

                    container.innerHTML = `
                        <div class="empty-cart">
                            <h2>Please login first</h2>
                        </div>
                    `;

                    return;
                }


                if (data.items.length === 0) {

                    container.innerHTML = `
                        <div class="empty-cart">
                            <h2>Your cart is empty 🛒</h2>
                            <br>
                            <a href="/home">
                                Continue Shopping
                            </a>
                        </div>
                    `;

                    return;
                }


                container.innerHTML = "";


                data.items.forEach(item => {

                    const cartItem =
                        document.createElement("div");

                    cartItem.className = "cart-item";


                    cartItem.innerHTML = `

                        <div class="product-info">

                            <h3>
                                ${item.name}
                            </h3>

                            <p>
                                Price: ₹${item.price}
                            </p>

                            <p>
                                Quantity: ${item.quantity}
                            </p>

                            <p class="subtotal">
                                Subtotal: ₹${item.subtotal}
                            </p>

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeItem(${item.cart_item_id})"
                        >
                            Remove
                        </button>

                    `;


                    container.appendChild(cartItem);

                });


                const summary =
                    document.createElement("div");

                summary.className = "cart-summary";


                summary.innerHTML = `

                    <h2>
                        Total: ₹${data.total.toFixed(2)}
                    </h2>

                    <button
                        class="checkout-btn"
                        onclick="checkout()"
                    >
                        Proceed to Checkout
                    </button>

                `;


                container.appendChild(summary);

            }

            catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="empty-cart">
                        <h2>Server connection error</h2>
                    </div>
                `;
            }
        }


        async function removeItem(cartItemId) {

            try {

                const response =
                    await fetch(
                        `/api/cart/remove/${cartItemId}`,
                        {
                            method: "DELETE"
                        }
                    );

                const data =
                    await response.json();


                if (data.status === "success") {

                    loadCart();

                }
                else {

                    alert(data.message);

                }

            }

            catch (error) {

                console.error(error);

                alert("Server connection error.");

            }
        }


        
        function checkout() {

    window.location.href = "/checkout";

}


        async function logout() {

            try {

                const response =
                    await fetch(
                        "/api/auth/logout",
                        {
                            method: "POST"
                        }
                    );

                const data =
                    await response.json();


                if (data.status === "success") {

                    window.location.href = "/login";

                }

            }

            catch (error) {

                console.error(error);

            }
        }


        loadCart();

    </script>

</body>
</html>
