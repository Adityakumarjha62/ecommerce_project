<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopSphere - Checkout</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f6fa;
        }

        nav {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .container {
            width: 86%;
            max-width: 700px;
            margin: 50px auto;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            ShopSphere
        </div>

        <div>

            <a href="/home">Home</a>

            <a href="/cart">Cart</a>

            <a href="/orders">Orders</a>

        </div>

    </nav>


    <div class="container">

        <div class="box">

            <h1>Checkout 🛒</h1>

            <label>
                Shipping Address
            </label>

            <textarea
                id="shippingAddress"
                placeholder="Enter your shipping address"
            ></textarea>

            <button onclick="placeOrder()">
                Place Order
            </button>

            <div id="message"></div>

        </div>

    </div>


    <script>

        async function placeOrder() {

            const address =
                document.getElementById(
                    "shippingAddress"
                ).value.trim();

            const message =
                document.getElementById("message");


            if (!address) {

                message.innerText =
                    "Please enter your shipping address.";

                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/orders/checkout",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                shipping_address: address
                            })
                        }
                    );


                const data =
                    await response.json();


                if (data.status === "success") {

                    message.innerText =
                        "Order placed successfully!";

                    setTimeout(function() {

                        window.location.href =
                            "/orders";

                    }, 1000);

                }
                else {

                    message.innerText =
                        data.message;

                }

            }
            catch (error) {

                console.error(error);

                message.innerText =
                    "Server connection error.";

            }

        }

    </script>

</body>

</html>
