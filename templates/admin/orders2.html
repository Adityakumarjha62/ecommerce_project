<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* ==============================
           NAVBAR
        ============================== */

        nav {
            background: #111827;
            color: white;
            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        nav h2 {
            font-size: 25px;
        }

        nav h2 span {
            color: #3b82f6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }


        /* ==============================
           CONTAINER
        ============================== */

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 45px 25px;
        }


        /* ==============================
           HEADING
        ============================== */

        .heading {
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #64748b;
            font-size: 16px;
        }


        /* ==============================
           STATS
        ============================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 22px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.05);
        }

        .stat-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            font-size: 28px;
        }


        /* ==============================
           ERROR
        ============================== */

        .error {
            display: none;

            background: #fee2e2;
            color: #b91c1c;

            padding: 15px;
            border-radius: 10px;

            margin-bottom: 20px;

            text-align: center;
        }


        /* ==============================
           LOADING
        ============================== */

        .loading {
            text-align: center;
            padding: 70px 20px;

            color: #64748b;
            font-size: 20px;
        }


        /* ==============================
           ORDERS
        ============================== */

        .orders-container {
            display: grid;
            gap: 22px;
        }


        .order-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 17px;

            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.06);

            transition: 0.3s;
        }

        .order-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.09);
        }


        /* ==============================
           ORDER TOP
        ============================== */

        .order-top {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding-bottom: 18px;

            border-bottom:
                1px solid #e5e7eb;

            margin-bottom: 20px;
        }

        .order-id {
            font-size: 21px;
            font-weight: bold;
        }

        .order-date {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
        }


        /* ==============================
           STATUS
        ============================== */

        .status-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-section label {
            font-size: 13px;
            font-weight: bold;
            color: #475569;
        }

        .status-select {
            padding: 9px 12px;

            border-radius: 8px;

            border: 1px solid #cbd5e1;

            background: white;

            font-size: 14px;

            cursor: pointer;

            outline: none;
        }

        .status-select:focus {
            border-color: #2563eb;
        }


        /* ==============================
           ORDER INFO
        ============================== */

        .order-info {
            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            gap: 20px;

            margin-bottom: 22px;
        }

        .info-box {
            background: #f8fafc;

            border-radius: 11px;

            padding: 16px;
        }

        .info-box .label {
            color: #64748b;

            font-size: 12px;

            margin-bottom: 7px;

            text-transform: uppercase;

            font-weight: bold;
        }

        .info-box .value {
            font-size: 15px;

            font-weight: bold;

            word-break: break-word;
        }


        /* ==============================
           SHIPPING
        ============================== */

        .shipping {
            background: #f8fafc;

            border-radius: 11px;

            padding: 17px;

            margin-bottom: 20px;
        }

        .shipping-title {
            font-size: 13px;

            font-weight: bold;

            color: #64748b;

            margin-bottom: 8px;

            text-transform: uppercase;
        }

        .shipping-address {
            font-size: 15px;
            line-height: 1.5;
        }


        /* ==============================
           ORDER BOTTOM
        ============================== */

        .order-bottom {
            display: flex;

            justify-content: space-between;
            align-items: center;

            border-top:
                1px solid #e5e7eb;

            padding-top: 20px;
        }

        .total-label {
            color: #64748b;
            font-size: 14px;
        }

        .total {
            font-size: 25px;
            font-weight: bold;
            margin-top: 4px;
        }


        /* ==============================
           VIEW BUTTON
        ============================== */

        .view-btn {
            display: inline-block;

            background: #2563eb;

            color: white;

            text-decoration: none;

            padding: 11px 18px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: bold;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }


        /* ==============================
           EMPTY
        ============================== */

        .empty {
            background: white;

            border-radius: 15px;

            padding: 70px 20px;

            text-align: center;

            color: #64748b;

            font-size: 19px;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .order-info {
                grid-template-columns: 1fr 1fr;
            }

        }


        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;

                flex-direction: column;

                gap: 15px;
            }

            nav a {
                margin-left: 10px;
            }

            .heading h1 {
                font-size: 29px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .status-section {
                width: 100%;

                flex-direction: column;

                align-items: flex-start;
            }

            .status-select {
                width: 100%;
            }

            .order-bottom {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .view-btn {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- ==============================
     NAVBAR
============================== -->

<nav>

    <h2>
        Admin<span>.</span>
    </h2>

    <div>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/admin/products">
            Products
        </a>

        <a href="/home">
            Store
        </a>

        <a href="/profile">
            Profile
        </a>

    </div>

</nav>



<!-- ==============================
     MAIN
============================== -->

<div class="container">


    <div class="heading">

        <h1>
            Manage Orders 📦
        </h1>

        <p>
            View and manage all customer orders
        </p>

    </div>



    <!-- ==============================
         STATS
    ============================== -->

    <div class="stats">

        <div class="stat-card">

            <p>
                Total Orders
            </p>

            <h2 id="totalOrders">
                0
            </h2>

        </div>


        <div class="stat-card">

            <p>
                Active Orders
            </p>

            <h2 id="activeOrders">
                0
            </h2>

        </div>


        <div class="stat-card">

            <p>
                Total Sales
            </p>

            <h2 id="totalSales">
                ₹0
            </h2>

        </div>

    </div>



    <!-- ==============================
         ERROR
    ============================== -->

    <div
        id="error"
        class="error"
    ></div>



    <!-- ==============================
         LOADING
    ============================== -->

    <div
        id="loading"
        class="loading"
    >

        Loading orders...

    </div>



    <!-- ==============================
         ORDERS
    ============================== -->

    <div
        id="ordersContainer"
        class="orders-container"
    ></div>


</div>



<script>


// ==========================================
// LOAD ORDERS
// ==========================================

async function loadOrders() {

    const loading =
        document.getElementById(
            "loading"
        );

    const container =
        document.getElementById(
            "ordersContainer"
        );


    loading.style.display =
        "block";

    container.innerHTML = "";


    try {

        const response =
            await fetch(
                "/api/admin/orders"
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            showError(
                data.message ||
                "Unable to load orders."
            );

            loading.style.display =
                "none";

            return;
        }


        const orders =
            data.orders || [];


        loading.style.display =
            "none";


        // ==================================
        // STATISTICS
        // ==================================

        document.getElementById(
            "totalOrders"
        ).innerText =
            orders.length;


        const activeOrders =
            orders.filter(
                function(order) {

                    return (
                        order.status !==
                        "cancelled"
                    );

                }
            ).length;


        document.getElementById(
            "activeOrders"
        ).innerText =
            activeOrders;


        const totalSales =
            orders.reduce(
                function(total, order) {

                    if (
                        order.status !==
                        "cancelled"
                    ) {

                        return (
                            total +
                            Number(
                                order.total_amount
                            )
                        );

                    }

                    return total;

                },
                0
            );


        document.getElementById(
            "totalSales"
        ).innerText =
            "₹" +
            totalSales.toLocaleString(
                "en-IN"
            );



        // ==================================
        // EMPTY ORDERS
        // ==================================

        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    📦 No orders found.

                </div>

            `;

            return;
        }



        // ==================================
        // CREATE ORDER CARDS
        // ==================================

        orders.forEach(
            function(order) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "order-card";


                card.innerHTML = `

                    <div class="order-top">


                        <div>

                            <div class="order-id">

                                Order #${order.id}

                            </div>


                            <div class="order-date">

                                ${order.created_at}

                            </div>

                        </div>



                        <div class="status-section">

                            <label>
                                Status:
                            </label>


                            <select
                                class="status-select"
                                onchange="
                                    updateOrderStatus(
                                        ${order.id},
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value="pending"
                                    ${order.status === "pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>


                                <option
                                    value="confirmed"
                                    ${order.status === "confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>


                                <option
                                    value="processing"
                                    ${order.status === "processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>


                                <option
                                    value="shipped"
                                    ${order.status === "shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>


                                <option
                                    value="delivered"
                                    ${order.status === "delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>


                                <option
                                    value="cancelled"
                                    ${order.status === "cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>

                    </div>



                    <div class="order-info">


                        <div class="info-box">

                            <div class="label">
                                Customer
                            </div>

                            <div class="value">

                                ${order.customer_name}

                            </div>

                        </div>


                        <div class="info-box">

                            <div class="label">
                                Email
                            </div>

                            <div class="value">

                                ${order.customer_email}

                            </div>

                        </div>


                        <div class="info-box">

                            <div class="label">
                                User ID
                            </div>

                            <div class="value">

                                ${order.user_id}

                            </div>

                        </div>

                    </div>



                    <div class="shipping">

                        <div class="shipping-title">

                            Shipping Address

                        </div>


                        <div class="shipping-address">

                            ${order.shipping_address}

                        </div>

                    </div>



                    <div class="order-bottom">


                        <div>

                            <div class="total-label">

                                Order Total

                            </div>


                            <div class="total">

                                ₹${Number(
                                    order.total_amount
                                ).toLocaleString(
                                    "en-IN"
                                )}

                            </div>

                        </div>



                        <!-- IMPORTANT:
                             Existing Order Details route
                             -->

                        <a
                            class="view-btn"
                            href="/order-details/${order.id}"
                        >

                            View Order →

                        </a>

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );

    }


    catch (error) {

        console.error(
            "Orders Error:",
            error
        );


        loading.style.display =
            "none";


        showError(
            "Server connection error."
        );

    }

}



// ==========================================
// UPDATE ORDER STATUS
// ==========================================

async function updateOrderStatus(
    orderId,
    newStatus
) {

    try {

        const response =
            await fetch(
                `/api/admin/orders/${orderId}/status`,
                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            status:
                                newStatus

                        })

                }
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            alert(
                data.message ||
                "Unable to update status."
            );

            return;
        }


        alert(
            "Order status updated successfully!"
        );


        loadOrders();

    }


    catch (error) {

        console.error(
            "Status Update Error:",
            error
        );


        alert(
            "Server connection error."
        );

    }

}



// ==========================================
// SHOW ERROR
// ==========================================

function showError(message) {

    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "block";


    error.innerText =
        message;

}



// ==========================================
// START
// ==========================================

loadOrders();


</script>


</body>

</html>
