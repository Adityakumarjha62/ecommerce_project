<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* ==========================
           NAVBAR
        ========================== */

        nav {
            background: #111827;
            color: white;
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        nav h2 {
            font-size: 25px;
        }

        nav h2 span {
            color: #3b82f6;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }


        /* ==========================
           MAIN CONTAINER
        ========================== */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 45px 25px;
        }


        /* ==========================
           HEADING
        ========================== */

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 36px;
        }

        .heading p {
            color: #64748b;
            margin-top: 7px;
            font-size: 16px;
        }


        /* ==========================
           ADD PRODUCT BUTTON
        ========================== */

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;

            padding: 13px 22px;

            border-radius: 9px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }


        /* ==========================
           FORM
        ========================== */

        .form-container {
            background: white;

            border-radius: 17px;

            padding: 30px;

            margin-bottom: 30px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.06);
        }

        .form-container h2 {
            margin-bottom: 25px;
            font-size: 25px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-container label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            font-size: 14px;
        }

        .form-container input,
        .form-container select,
        .form-container textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        .form-container input:focus,
        .form-container select:focus,
        .form-container textarea:focus {

            border-color: #2563eb;
        }

        .description-field {
            margin-top: 20px;
        }

        .description-field textarea {
            resize: vertical;
        }


        /* ==========================
           FORM BUTTONS
        ========================== */

        .form-buttons {

            display: flex;

            gap: 12px;

            margin-top: 22px;
        }

        .save-btn,
        .cancel-btn {

            padding: 12px 22px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        .save-btn {

            background: #2563eb;

            color: white;
        }

        .save-btn:hover {

            background: #1d4ed8;
        }

        .cancel-btn {

            background: #e5e7eb;

            color: #172033;
        }

        .cancel-btn:hover {

            background: #d1d5db;
        }


        /* ==========================
           PRODUCT GRID
        ========================== */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }


        /* ==========================
           PRODUCT CARD
        ========================== */

        .product-card {

            background: white;

            border-radius: 17px;

            padding: 24px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.06);

            transition: 0.3s;
        }

        .product-card:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.10);
        }


        /* ==========================
           PRODUCT IMAGE
        ========================== */

        .product-image {

            height: 180px;

            background: #f1f5f9;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 60px;

            margin-bottom: 20px;

            overflow: hidden;
        }

        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .product-card h3 {

            font-size: 21px;

            margin-bottom: 8px;
        }

        .description {

            color: #64748b;

            font-size: 14px;

            line-height: 1.5;

            min-height: 42px;

            margin-bottom: 15px;
        }

        .price {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .stock {

            font-size: 14px;

            margin-bottom: 15px;

            color: #475569;
        }


        /* ==========================
           STATUS
        ========================== */

        .status {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #dcfce7;

            color: #166534;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        /* ==========================
           ACTION BUTTONS
        ========================== */

        .actions {

            display: flex;

            gap: 10px;
        }

        .edit-btn,
        .delete-btn {

            flex: 1;

            padding: 10px;

            border-radius: 8px;

            border: none;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;
        }

        .edit-btn {

            background: #2563eb;

            color: white;
        }

        .edit-btn:hover {

            background: #1d4ed8;
        }

        .delete-btn {

            background: #fee2e2;

            color: #b91c1c;
        }

        .delete-btn:hover {

            background: #fecaca;
        }


        /* ==========================
           LOADING
        ========================== */

        .loading {

            text-align: center;

            padding: 80px 20px;

            color: #64748b;

            font-size: 20px;
        }


        /* ==========================
           ERROR
        ========================== */

        .error {

            background: #fee2e2;

            color: #b91c1c;

            padding: 18px;

            border-radius: 10px;

            text-align: center;

            margin-bottom: 20px;
        }


        /* ==========================
           EMPTY
        ========================== */

        .empty {

            text-align: center;

            padding: 70px 20px;

            color: #64748b;

            font-size: 19px;
        }


        /* ==========================
           RESPONSIVE
        ========================== */

        @media (max-width: 900px) {

            .products-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 600px) {

            nav {

                padding: 0 20px;
            }

            nav a {

                margin-left: 10px;
            }

            .heading {

                flex-direction: column;

                align-items: flex-start;

                gap: 20px;
            }

            .products-grid {

                grid-template-columns: 1fr;
            }

            .form-grid {

                grid-template-columns: 1fr;
            }

            .form-buttons {

                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<nav>

    <h2>
        Admin<span>.</span>
    </h2>

    <div>

        <a href="/admin/dashboard">
            Dashboard
        </a>

        <a href="/home">
            Store
        </a>

        <a href="/wishlist">
            ❤️ Wishlist
        </a>

        <a href="/profile">
            Profile
        </a>

    </div>

</nav>



<!-- ==========================
     MAIN
========================== -->

<div class="container">


    <!-- ==========================
         HEADING
    ========================== -->

    <div class="heading">

        <div>

            <h1>
                Manage Products 📦
            </h1>

            <p>
                Add, edit and delete your store products
            </p>

        </div>


        <button
            class="add-btn"
            onclick="addProduct()">

            + Add Product

        </button>

    </div>



    <!-- ==========================
         PRODUCT FORM
    ========================== -->

    <div
        id="productForm"
        class="form-container"
        style="display:none;"
    >

        <h2 id="formTitle">
            Add New Product
        </h2>


        <form
            onsubmit="submitProduct(event)"
        >


            <div class="form-grid">


                <!-- Product Name -->

                <div>

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>



                <!-- Category -->

                <div>

                    <label>
                        Category
                    </label>

                    <select
                        id="productCategory"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="1">
                            Electronics
                        </option>

                        <option value="2">
                            Fashion
                        </option>

                        <option value="3">
                            Home
                        </option>

                        <option value="4">
                            Books
                        </option>

                    </select>

                </div>



                <!-- Price -->

                <div>

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        placeholder="Enter price"
                        required
                    >

                </div>



                <!-- Discount -->

                <div>

                    <label>
                        Discount (%)
                    </label>

                    <input
                        type="number"
                        id="productDiscount"
                        min="0"
                        max="100"
                        step="0.01"
                        value="0"
                    >

                </div>



                <!-- Stock -->

                <div>

                    <label>
                        Stock
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        min="0"
                        placeholder="Enter stock"
                        required
                    >

                </div>



                <!-- Image -->

                <div>

                    <label>
                        Image Name
                    </label>

                    <input
                        type="text"
                        id="productImage"
                        placeholder="example.jpg"
                    >

                </div>


            </div>



            <!-- Description -->

            <div class="description-field">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    rows="4"
                    placeholder="Enter product description"
                ></textarea>

            </div>



            <!-- Buttons -->

            <div class="form-buttons">

                <button
                    type="submit"
                    class="save-btn"
                    id="saveButton"
                >
                    Save Product
                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeProductForm()"
                >
                    Cancel
                </button>

            </div>


        </form>

    </div>



    <!-- ==========================
         ERROR
    ========================== -->

    <div
        id="error"
        class="error"
        style="display:none;"
    ></div>



    <!-- ==========================
         LOADING
    ========================== -->

    <div
        id="loading"
        class="loading"
    >

        Loading products...

    </div>



    <!-- ==========================
         PRODUCTS
    ========================== -->

    <div
        id="productsGrid"
        class="products-grid"
        style="display:none;"
    >

    </div>


</div>



<script>


// ==========================================
// EDITING PRODUCT ID
// ==========================================

let editingProductId = null;



// ==========================================
// LOAD PRODUCTS
// ==========================================

async function loadProducts() {

    const loading =
        document.getElementById(
            "loading"
        );

    const grid =
        document.getElementById(
            "productsGrid"
        );


    loading.style.display = "block";

    grid.style.display = "none";


    try {

        const response =
            await fetch(
                "/api/products/"
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            showError(
                data.message ||
                "Unable to load products."
            );

            return;
        }


        const products =
            data.products || [];


        loading.style.display = "none";


        if (products.length === 0) {

            grid.style.display = "block";

            grid.innerHTML = `
                <div class="empty">
                    No products found.
                </div>
            `;

            return;
        }


        grid.style.display = "grid";

        grid.innerHTML = "";


        products.forEach(
            function(product) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";


                let imageHTML = "🛍️";


                if (product.image) {

                    imageHTML = `
                        <img
                            src="/static/images/${product.image}"
                            alt="${product.name}"
                            onerror="
                                this.style.display='none';
                                this.parentElement.innerHTML='🛍️';
                            "
                        >
                    `;

                }


                card.innerHTML = `

                    <div class="product-image">

                        ${imageHTML}

                    </div>


                    <h3>
                        ${product.name}
                    </h3>


                    <p class="description">

                        ${
                            product.description ||
                            "No description available."
                        }

                    </p>


                    <div class="price">

                        ₹${Number(
                            product.price
                        ).toLocaleString(
                            "en-IN"
                        )}

                    </div>


                    <div class="stock">

                        Stock:
                        <strong>
                            ${product.stock}
                        </strong>

                    </div>


                    <div class="status">

                        ${product.status}

                    </div>


                    <div class="actions">

                        <button
                            class="edit-btn"
                            onclick="editProduct(${product.id})"
                        >

                            ✏️ Edit

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${product.id})"
                        >

                            🗑️ Delete

                        </button>

                    </div>

                `;


                grid.appendChild(card);

            }
        );

    }


    catch (error) {

        console.error(
            "Load Products Error:",
            error
        );

        showError(
            "Server connection error."
        );

    }

}



// ==========================================
// SHOW ERROR
// ==========================================

function showError(message) {

    document.getElementById(
        "loading"
    ).style.display = "none";


    const error =
        document.getElementById(
            "error"
        );


    error.style.display = "block";


    error.innerText =
        message;

}



// ==========================================
// ADD PRODUCT
// ==========================================

function addProduct() {

    editingProductId = null;


    const form =
        document.getElementById(
            "productForm"
        );


    form.style.display = "block";


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add New Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Save Product";


    document.querySelector(
        "#productForm form"
    ).reset();


    document.getElementById(
        "productDiscount"
    ).value = 0;


    form.scrollIntoView({
        behavior: "smooth"
    });

}



// ==========================================
// EDIT PRODUCT
// ==========================================

async function editProduct(productId) {

    try {

        const response =
            await fetch(
                `/api/products/${productId}`
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            alert(
                data.message ||
                "Unable to load product."
            );

            return;
        }


        const product =
            data.product;


        // Store ID

        editingProductId =
            productId;


        // Open form

        const form =
            document.getElementById(
                "productForm"
            );


        form.style.display =
            "block";


        // Change title

        document.getElementById(
            "formTitle"
        ).innerText =
            "Edit Product";


        // Change button

        document.getElementById(
            "saveButton"
        ).innerText =
            "Update Product";


        // Fill data

        document.getElementById(
            "productName"
        ).value =
            product.name || "";


        document.getElementById(
            "productCategory"
        ).value =
            product.category_id || "";


        document.getElementById(
            "productPrice"
        ).value =
            product.price || "";


        document.getElementById(
            "productDiscount"
        ).value =
            product.discount || 0;


        document.getElementById(
            "productStock"
        ).value =
            product.stock || 0;


        document.getElementById(
            "productImage"
        ).value =
            product.image || "";


        document.getElementById(
            "productDescription"
        ).value =
            product.description || "";


        // Scroll

        form.scrollIntoView({
            behavior: "smooth"
        });

    }


    catch (error) {

        console.error(
            "Edit Product Error:",
            error
        );

        alert(
            "Server connection error."
        );

    }

}



// ==========================================
// CLOSE FORM
// ==========================================

function closeProductForm() {

    editingProductId = null;


    const form =
        document.getElementById(
            "productForm"
        );


    form.style.display =
        "none";


    document.querySelector(
        "#productForm form"
    ).reset();


    document.getElementById(
        "formTitle"
    ).innerText =
        "Add New Product";


    document.getElementById(
        "saveButton"
    ).innerText =
        "Save Product";

}



// ==========================================
// SUBMIT PRODUCT
// ADD + UPDATE
// ==========================================

async function submitProduct(event) {

    event.preventDefault();


    const product = {

        category_id:
            Number(
                document.getElementById(
                    "productCategory"
                ).value
            ),

        name:
            document.getElementById(
                "productName"
            ).value.trim(),

        description:
            document.getElementById(
                "productDescription"
            ).value.trim(),

        price:
            Number(
                document.getElementById(
                    "productPrice"
                ).value
            ),

        discount:
            Number(
                document.getElementById(
                    "productDiscount"
                ).value
            ),

        stock:
            Number(
                document.getElementById(
                    "productStock"
                ).value
            ),

        image:
            document.getElementById(
                "productImage"
            ).value.trim(),

        status:
            "active"

    };


    try {


        // ==================================
        // UPDATE EXISTING PRODUCT
        // ==================================

        if (editingProductId !== null) {

            const response =
                await fetch(
                    `/api/products/${editingProductId}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                product
                            )

                    }
                );


            const data =
                await response.json();


            if (data.status !== "success") {

                alert(
                    data.message ||
                    "Unable to update product."
                );

                return;
            }


            alert(
                "Product updated successfully!"
            );


            closeProductForm();


            loadProducts();


            return;
        }



        // ==================================
        // ADD NEW PRODUCT
        // ==================================

        const response =
            await fetch(
                "/api/products/",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            product
                        )

                }
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            alert(
                data.message ||
                "Unable to add product."
            );

            return;
        }


        alert(
            "Product added successfully!"
        );


        closeProductForm();


        loadProducts();

    }


    catch (error) {

        console.error(
            "Save Product Error:",
            error
        );

        alert(
            "Server connection error."
        );

    }

}



// ==========================================
// DELETE PRODUCT
// ==========================================

async function deleteProduct(productId) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmDelete) {

        return;
    }


    try {

        const response =
            await fetch(
                `/api/products/${productId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (data.status !== "success") {

            alert(
                data.message ||
                "Unable to delete product."
            );

            return;
        }


        alert(
            "Product deleted successfully!"
        );


        loadProducts();

    }


    catch (error) {

        console.error(
            "Delete Product Error:",
            error
        );

        alert(
            "Server connection error."
        );

    }

}



// ==========================================
// START
// ==========================================

loadProducts();


</script>


</body>

</html>
